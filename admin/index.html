<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrador | ClickOnMe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../brand.css">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,rgba(189,25,255,.17),transparent 38%),#050713;color:#fff;font-family:Poppins,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:24px 0 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.top img{width:190px}.top-actions{display:flex;gap:10px;flex-wrap:wrap}button,.button{border:0;border-radius:12px;padding:12px 16px;font:600 14px Poppins;color:#fff;background:#202a49;cursor:pointer;text-decoration:none}.primary{background:linear-gradient(135deg,#bd19ff,#0077ff,#00e5ff)}.panel{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:22px;margin-bottom:20px}.login{max-width:500px;margin:80px auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px;border-radius:16px;background:#10162a}.stat strong{display:block;font-size:28px}.muted{color:#aeb7d0;font-size:13px}.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}label{display:block;color:#cbd3e8;font-size:12px;margin-bottom:6px}input,select{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:11px;background:#0e1427;color:#fff;font:14px Poppins}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}th{color:#9fa9c4}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;background:#26324f}.active{background:#123e34;color:#73f4ca}.trial{background:#3b3217;color:#ffe083}.suspended,.expired{background:#461f2a;color:#ff9fb5}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.row-actions button,.row-actions a{padding:7px 9px;font-size:11px}.hidden{display:none!important}.message{margin-top:12px;color:#aeb7d0;font-size:13px}@media(max-width:850px){.grid,.price-grid{grid-template-columns:1fr 1fr}.table-wrap{overflow:auto}.top{align-items:flex-start}.top img{width:155px}}@media(max-width:520px){.grid,.price-grid{grid-template-columns:1fr}.wrap{width:min(100% - 20px,1180px)}.panel{padding:16px}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><a href="/"><img src="../logo-clickonme.png" alt="ClickOnMe"></a><div class="top-actions"><a class="button primary hidden" id="newCard" href="/crear/?new=1">+ Nueva tarjeta</a><button class="hidden" id="logout">Cerrar sesión</button></div></header>
  <section class="panel login" id="loginPanel"><h1>Panel de administrador</h1><p class="muted">Acceso exclusivo del propietario.</p><label>Correo</label><input id="email" type="email" autocomplete="email"><br><br><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><br><br><button class="primary" id="login">Entrar</button><p class="message" id="loginMessage"></p></section>
  <section id="dashboard" class="hidden">
    <div class="grid" id="stats"></div>
    <section class="panel"><h2>Precios y promoción</h2><div class="price-grid"><div><label>Plan anual (MXN)</label><input id="annual" type="number" min="1"></div><div><label>Promoción (MXN)</label><input id="promo" type="number" min="1"></div><div><label>Diseño por Pablo (MXN)</label><input id="design" type="number" min="1"></div><div><label>Promoción activa</label><select id="promoActive"><option value="true">Sí</option><option value="false">No</option></select></div></div><br><label>Nombre de la promoción</label><input id="promoLabel"><br><br><button class="primary" id="savePrices">Guardar precios</button><span class="message" id="priceMessage"></span></section>
    <section class="panel"><h2>Clientes y tarjetas</h2><div class="table-wrap"><table><thead><tr><th>Tarjeta</th><th>Dirección</th><th>Estado</th><th>Vencimiento</th><th>Acciones</th></tr></thead><tbody id="cards"></tbody></table></div><p class="message" id="cardsMessage"></p></section>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../supabase-config.js"></script>
<script>
const db=window.supabase.createClient(window.CLICKONME_SUPABASE_URL,window.CLICKONME_SUPABASE_KEY);let settings=null;
const $=id=>document.getElementById(id);const fmt=d=>d?new Intl.DateTimeFormat('es-MX',{dateStyle:'medium'}).format(new Date(d)):'Sin fecha';
async function verifyAdmin(){const {data:{user}}=await db.auth.getUser();if(!user)return false;const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();return !error&&!!data}
async function openDashboard(){if(!await verifyAdmin()){await db.auth.signOut();$('loginMessage').textContent='Esta cuenta no tiene permisos de administrador.';return}$('loginPanel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');$('newCard').classList.remove('hidden');await Promise.all([loadSettings(),loadCards()])}
async function loadSettings(){const {data,error}=await db.from('business_settings').select('*').eq('id','main').single();if(error){$('priceMessage').textContent=error.message;return}settings=data;$('annual').value=data.annual_price_mxn;$('promo').value=data.launch_price_mxn||'';$('design').value=data.design_service_price_mxn;$('promoActive').value=String(data.launch_promo_active);$('promoLabel').value=data.launch_promo_label||''}
async function loadCards(){const {data,error}=await db.from('profiles').select('id,slug,name,status,trial_ends_at,current_period_end,created_at').order('created_at',{ascending:false});if(error){$('cardsMessage').textContent=error.message;return}const counts={all:data.length,active:data.filter(x=>x.status==='active').length,trial:data.filter(x=>x.status==='trial').length,suspended:data.filter(x=>['suspended','expired'].includes(x.status)).length};$('stats').innerHTML=`<div class="stat"><span class="muted">Tarjetas</span><strong>${counts.all}</strong></div><div class="stat"><span class="muted">Activas</span><strong>${counts.active}</strong></div><div class="stat"><span class="muted">En prueba</span><strong>${counts.trial}</strong></div><div class="stat"><span class="muted">Suspendidas</span><strong>${counts.suspended}</strong></div>`;$('cards').innerHTML=data.map(x=>`<tr><td><strong>${escapeHtml(x.name)}</strong></td><td>/${escapeHtml(x.slug)}</td><td><span class="badge ${x.status}">${x.status}</span></td><td>${fmt(x.current_period_end||x.trial_ends_at)}</td><td><div class="row-actions"><a class="button" href="/crear/?id=${x.id}">Editar</a><a class="button" href="/crear/perfil.html?u=${encodeURIComponent(x.slug)}" target="_blank">Ver</a><button data-id="${x.id}" data-status="active">Activar</button><button data-id="${x.id}" data-status="suspended">Suspender</button></div></td></tr>`).join('')||'<tr><td colspan="5">No hay tarjetas.</td></tr>'}
function escapeHtml(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('login').onclick=async()=>{ $('loginMessage').textContent='Verificando…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMessage').textContent='Correo o contraseña incorrectos.';return}await openDashboard()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('savePrices').onclick=async()=>{const update={annual_price_mxn:Number($('annual').value),launch_price_mxn:Number($('promo').value)||null,design_service_price_mxn:Number($('design').value),launch_promo_active:$('promoActive').value==='true',launch_promo_label:$('promoLabel').value.trim(),updated_at:new Date().toISOString()};const {error}=await db.from('business_settings').update(update).eq('id','main');$('priceMessage').textContent=error?'No se guardó: '+error.message:'Precios guardados ✓'};
$('cards').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;b.disabled=true;const update={status:b.dataset.status,updated_at:new Date().toISOString()};if(b.dataset.status==='active'){const end=new Date();end.setFullYear(end.getFullYear()+1);update.current_period_end=end.toISOString()}const {error}=await db.from('profiles').update(update).eq('id',b.dataset.id);if(error)alert(error.message);await loadCards()};
(async()=>{const {data:{session}}=await db.auth.getSession();if(session)await openDashboard()})();
</script></body></html>
