name: ClickOnMe Security Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for exposed secrets and risky files
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          forbidden_names = {
              ".env", ".env.local", ".env.production",
              "id_rsa", "id_ed25519"
          }

          patterns = {
              "GitHub token": re.compile(r"(?:ghp_|github_pat_)[A-Za-z0-9_]{20,}"),
              "Private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "Mercado Pago access token": re.compile(r"APP_USR-[A-Za-z0-9_-]{20,}"),
              "Supabase service-role secret": re.compile(r"(?i)(?:SUPABASE_SERVICE_ROLE(?:_KEY)?|service_role_key)\s*[:=]\s*['\"]?[A-Za-z0-9._-]{20,}"),
              "Resend API key assignment": re.compile(r"(?i)RESEND_API_KEY\s*[:=]\s*['\"]?[A-Za-z0-9._-]{12,}"),
              "Generic secret assignment": re.compile(r"(?i)(?:SECRET_KEY|PRIVATE_KEY)\s*[:=]\s*['\"]?[A-Za-z0-9._/+\-=]{20,}"),
          }

          binary_ext = {
              ".png",".jpg",".jpeg",".gif",".webp",".ico",".pdf",".zip",
              ".woff",".woff2",".ttf",".mp3",".mp4"
          }

          findings = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.name in forbidden_names or path.suffix.lower() in {".pem",".key",".p12",".pfx"}:
                  findings.append(f"Forbidden sensitive file: {path}")
                  continue
              if path.suffix.lower() in binary_ext:
                  continue
              try:
                  body = path.read_text(errors="ignore")
              except Exception:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(body):
                      findings.append(f"{label}: {path}")

          workflows = Path(".github/workflows")
          if workflows.exists():
              for path in workflows.glob("*.y*ml"):
                  body = path.read_text(errors="ignore")
                  if re.search(r"(?im)^\s*permissions:\s*write-all\s*$", body):
                      findings.append(f"Workflow grants write-all permissions: {path}")
                  if re.search(r"(?im)^\s*pull_request_target\s*:", body):
                      findings.append(f"Review pull_request_target usage: {path}")

          if findings:
              print("SECURITY CHECK FAILED")
              for item in sorted(set(findings)):
                  print(" -", item)
              sys.exit(1)

          print("PASS: no exposed high-risk secrets or forbidden private-key files detected.")

      - name: Verify critical security files
        shell: bash
        run: |
          test -f SECURITY.md
          test -f .gitignore
          test -f .github/CODEOWNERS
          grep -q 'service-role' SECURITY.md
          echo "PASS: security policy and ownership files present."
