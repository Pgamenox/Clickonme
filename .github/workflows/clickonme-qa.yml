name: ClickOnMe QA Gate
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  constructor-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate constructor HTML and extract inline JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          p=Path("crear/index.html")
          s=p.read_text()
          checks={
            "style tags": len(re.findall(r"<style(?:\s|>)",s,re.I))==len(re.findall(r"</style>",s,re.I)),
            "script tags": len(re.findall(r"<script(?:\s|>)",s,re.I))==len(re.findall(r"</script>",s,re.I)),
            "single signin button": s.count('id="signinBtn"')==1,
            "single auth status": s.count('id="authStatus"')==1,
            "supabase config": '../supabase-config.js' in s,
            "auth bridge": './auth-bridge.js' in s,
            "no merge markers": not any(x in s for x in ("<<<<<<<","=======",">>>>>>>")),
          }
          launch=s[s.find('<section class="launch-section"'):s.find("</section>",s.find('<section class="launch-section"'))+10]
          checks["no launch emojis"]=all(x not in launch for x in ("📲","📈"))
          checks.pop("no launch emojis placeholder",None)
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)
          blocks=re.findall(r"<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>",s,re.I)
          Path("/tmp/inline.js").write_text("\n;\n".join(blocks))
          print("inline blocks",len(blocks),"bytes",Path("/tmp/inline.js").stat().st_size)
          PY
      - name: JavaScript syntax
        run: |
          node --check /tmp/inline.js
          node --check crear/auth-bridge.js
          node --check supabase-config.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path("crear/perfil.html").read_text()
          blocks=re.findall(r"<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>",s,re.I)
          Path("/tmp/profile-inline.js").write_text("\n;\n".join(blocks))
          PY
          node --check /tmp/profile-inline.js
      - name: Critical auth contract
        run: |
          grep -q 'signInWithPassword' crear/auth-bridge.js
          grep -q '__CLICKONME_AUTH_CLIENT' crear/index.html
          grep -q 'auth.getSession' crear/index.html
          grep -q 'loadOwnProfile' crear/index.html
          grep -q 'loadMyCards' crear/index.html


      - name: Mini Store beta and stress contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,sys
          builder=Path("crear/index.html").read_text()
          profile=Path("crear/perfil.html").read_text()
          checks={
            "store editor": 'id="storeEnabled"' in builder and 'id="storeProductsEditor"' in builder,
            "six product cap": 'storeProducts.length>=6' in builder and 'slice(0,6)' in builder,
            "store persistence": 'modules?.store' in builder and 'profileData.modules.store.products=uploadedStore' in builder,
            "store renderer": 'function renderStoreModule' in profile and 'id="storeGrid"' in profile,
            "whatsapp order": '"https://wa.me/"+wa+"?text="' in profile,
            "store analytics": 'trackInteraction("store_order",name)' in profile,
            "business gating": '[storeEnabled,2,"Business"]' in builder and 'planLevel<2&&d.modules?.store' in profile,
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)

          # Stress the data model with 10,000 synthetic carts/catalogs.
          # No network calls: deterministic boundary/fuzz test of the shipped limits.
          for n in range(10000):
            products=[{"name":"Producto "+str(i)+" X"*40,"price":str((i+1)*19.95),"description":"D"*300,"image":"https://example.invalid/p.jpg"} for i in range(n%12)]
            saved=[{"name":str(x["name"]).strip()[:80],"price":str(x["price"]).strip(),"description":str(x["description"]).strip()[:140],"image":x["image"]} for x in products[:6] if str(x["name"]).strip() and str(x["price"]).strip()]
            assert len(saved)<=6
            assert all(len(x["name"])<=80 and len(x["description"])<=140 for x in saved)
          print("PASS 10000 synthetic mini-store boundary iterations")
          PY

      - name: Consolidated sales-readiness regression contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          builder=Path("crear/index.html").read_text()
          profile=Path("crear/perfil.html").read_text()
          sw=Path("sw.js").read_text()
          manifest=Path("supabase/functions/profile-manifest/index.ts").read_text()
          auth=Path("crear/auth-bridge.js").read_text()
          checks={
            "login validates persisted session": "signInWithPassword" in auth and "auth.getSession()" in auth and "clickonme_auth_handoff" in auth,
            "builder restores auth handoff": "clickonme_auth_handoff" in builder and "auth.setSession" in builder,
            "publish create/update paths": '.insert(payload)' in builder and '.update(payload)' in builder and "loadOwnProfile" in builder,
            "single customer card guard": "Tu cuenta ya tiene una tarjeta ClickOnMe" in builder,
            "public URL after save": "crear/perfil.html?u=" in builder and "updateProfileLink" in builder,
            "mobile preview/save controls": "mobilePreviewBtn" in builder and "mobileSaveButton" in builder,
            "share copy qr": all(x in profile for x in ("shareBtn","copyBtn","qrBtn","navigator.share","navigator.clipboard")),
            "service worker registered": 'navigator.serviceWorker.register("/sw.js"' in profile,
            "service worker network-first profile/home": 'isProfile||isHomepage' in sw and "fetch(event.request)" in sw,
            "individual manifest wired": "profile-manifest" in profile and "dynamicManifest" in profile,
            "manifest opens exact profile": '"/crear/perfil.html?u="' in manifest and '"&source=pwa"' in manifest,
            "install state handled": "beforeinstallprompt" in profile and "appinstalled" in profile and "runningAsApp" in profile,
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Homepage premium visual contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          s=Path("index.html").read_text()
          checks={
            "premium v4 marker": "V4 LIVE PREMIUM CARDS 2026-09-21" in s,
            "live premium data marker": "premium-v4" in s,
            "Ana placeholder removed": "ana-perez.svg" not in s,
            "Ana uses premium photo": "images.unsplash.com/photo-1494790108377-be9c29b29330" in s,
            "Ana has no legacy fallback": "fallback:'/assets/examples/creator.jpg'" not in s,
            "five plan styles": all(x in s for x in ("demo-free[data-visual=\"premium-v4\"]","demo-personal[data-visual=\"premium-v4\"]","demo-business[data-visual=\"premium-v4\"]","demo-artista[data-visual=\"premium-v4\"]","demo-creator[data-visual=\"premium-v4\"]")),
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Homepage real designer demos contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          s=Path("index.html").read_text()
          demo_slugs=[
            "demo-clickonme-free",
            "demo-clickonme-personal",
            "demo-clickonme-business",
            "demo-clickonme-artista",
            "demo-clickonme-creator",
          ]
          checks={
            "old example cards removed": all(x not in s for x in ("La Mesa Norteña","Valeria Luna","Daniel Ríos","Nico Sol")),
            "real demo section exists": 'class="examples real-demo-examples"' in s and "Ejemplos reales creados con ClickOnMe" in s,
            "five real public profiles wired": all(x in s for x in demo_slugs),
            "five iframe previews": s.count('class="real-phone-frame"') == 5 and s.count('title="Demo real ') == 5,
            "real profile open actions": s.count("Abrir tarjeta real") == 5,
            "legacy showcase generator removed": 'id="premiumShowcaseGrid"' not in s and "showcase.innerHTML=demos.map" not in s,
            "five hero plans preserved": all(x in s for x in ("plan:'FREE'","plan:'PERSONAL'","plan:'BUSINESS'","plan:'ARTISTA'","plan:'CREATOR'")),
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Carousel performance and premium contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          s=Path("index.html").read_text()
          checks={
            "hero optimized images": s.count("hero:'https://images.unsplash.com/") >= 5 and "w=420&h=520&q=80" in s,
            "hero preload cache": "const heroCache=new Map()" in s and "function preloadHero" in s and "Promise.all(demos.map(preloadHero))" in s,
            "switch waits for photo": "async function show(n)" in s and "src=await preloadHero(d)" in s,
            "premium hero refinement": "PREMIUM HERO V5" in s,
            "hero limited to three actions": "d.links.slice(0,3)" in s,
            "high priority first image": 'fetchpriority="high"' in s,
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Premium benefits coherence contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          s=Path("index.html").read_text()
          checks={
            "compact premium benefits": "PREMIUM BENEFITS V2" in s and 'class="features benefits-section"' in s,
            "no emoji benefit icons": all(x not in s for x in (">💬<",">🚀<",">🔗<")),
            "line svg icons": s.count('class="benefit-icon"') == 3 and s.count("<svg viewBox=") >= 3,
            "three compact items": s.count('class="benefit-item"') == 3,
            "mobile compact layout": "@media(max-width:520px)" in s and ".benefit-item{padding:15px 14px}" in s,
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Flash-free carousel and compact spacing contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          s=Path("index.html").read_text()
          checks={
            "no opacity flash": "demoFade" not in s and "@keyframes demoShift" in s,
            "decoded hero preload": "await im.decode()" in s,
            "compact launch": 'class="launch-section"' in s and "PREMIUM LAUNCH V2" in s,
            "no launch emojis": all(x not in s[s.find('<section class="launch-section"'):s.find("</section>",s.find('<section class="launch-section"'))+10] for x in ("📲","📈")),
            "mobile gap reduced": ".cta{margin-bottom:34px}" in s and ".launch-section{padding:0 15px 38px}" in s,
            "compact launch rows": ".launch-strip article{min-height:0" in s,
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Premium cards V6 visual contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          s=Path("index.html").read_text()
          checks={
            "premium v6 marker": "PREMIUM CARDS V6" in s and "PREMIUM SHOWCASE V6" in s,
            "monochrome hero markers": "demo-link-mark" in s and "showcase-mark" in s,
            "hero labels no emoji rendering": "x[0]+' '+x[1]" not in s,
            "five plan identities preserved": all(x in s for x in ("demo-free[data-visual=\"premium-v4\"]","demo-personal[data-visual=\"premium-v4\"]","demo-business[data-visual=\"premium-v4\"]","demo-artista[data-visual=\"premium-v4\"]","demo-creator[data-visual=\"premium-v4\"]")),
            "premium showcase compact": ".premium-showcase-card{" in s and "min-height:0" in s,
            "carousel logic preserved": "async function show(n)" in s and "preloadHero" in s and "restart()" in s,
          }
          for k,v in checks.items(): print(("PASS " if v else "FAIL ")+k)
          if not all(checks.values()): sys.exit(1)
          PY

      - name: Public profile contract
        run: |
          grep -q 'profile_view' crear/perfil.html
          grep -q 'shareBtn' crear/perfil.html
          grep -q 'copyBtn' crear/perfil.html
          grep -q 'qrBtn' crear/perfil.html
          grep -q 'installBtn' crear/perfil.html
          grep -q 'profile-manifest' crear/perfil.html
          grep -q 'startupGuard' crear/perfil.html
