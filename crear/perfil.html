<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi ClickOnMe</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:'Poppins',Arial,sans-serif;
  background:radial-gradient(circle at top right,rgba(189,25,255,.26) 0,transparent 38%),radial-gradient(circle at bottom left,rgba(0,229,255,.20) 0,transparent 35%),var(--com-bg);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:14px;
  padding:20px;
  position:relative;
  isolation:isolate;
  overflow-x:hidden;
  --profile-bg:radial-gradient(circle at top right,rgba(189,25,255,.26) 0,transparent 38%),radial-gradient(circle at bottom left,rgba(0,229,255,.20) 0,transparent 35%),var(--com-bg);
  --profile-overlay:rgba(0,0,0,0);
  --profile-blur:0px;
  --profile-position:center;
}

body::before{content:'';position:fixed;inset:-18px;background:var(--profile-bg);background-size:cover;background-position:var(--profile-position);filter:blur(var(--profile-blur));z-index:-2}
body::after{content:'';position:fixed;inset:0;background:var(--profile-overlay);z-index:-1;pointer-events:none}
.com-brandbar,.card{position:relative;z-index:1}

.card{
  width:100%;
  max-width:440px;
  padding:34px 28px;
  border-radius:32px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  text-align:center;
}

.avatar{
  width:110px;
  height:110px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:rgba(255,255,255,.08);
  border:3px solid rgba(255,255,255,.35);
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.avatar.shape-rounded{border-radius:22px}
.avatar.shape-square{border-radius:0}
.avatar.shape-portrait{width:132px;height:168px;border-radius:22px}
.avatar.shape-wide{width:100%;height:190px;border-radius:22px}
.btn-icon{width:26px;height:26px;display:inline-grid;place-items:center;flex:0 0 26px;font-size:19px;margin-right:8px}
.btn-icon img{width:100%;height:100%;object-fit:contain;display:block}

h1{
  font-size:28px;
  margin-bottom:10px;
}

.role{
  color:#d5d6e5;
  font-size:16px;
  margin-bottom:16px;
}

.description{
  color:#b9bbca;
  font-size:14px;
  line-height:1.5;
  margin-bottom:22px;
}

.brand{
  font-size:27px;
  font-weight:800;
  margin:12px 0 25px;
}

.brand span{
  color:#1677ff;
}

.links{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:58px;
  padding:15px;
  border-radius:17px;
  text-decoration:none;
  color:white;
  font-weight:700;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);
}

.btn:hover{
  background:rgba(255,255,255,.15);
}

.footer{margin-top:25px;padding-top:14px;border-top:1px solid rgba(255,255,255,.10);color:#85889a;font-size:10px;line-height:1.4;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.footer img{width:88px;max-width:32%;height:auto;display:block}

@media(max-width:600px){
  body{
    padding:10px;
    align-items:flex-start;
  }

  .card{
    max-width:390px;
    padding:22px 16px;
    border-radius:24px;
  }

  .avatar{
    width:82px;
    height:82px;
    margin-bottom:12px;
  }

  h1{
    font-size:22px;
  }

  .role{
    font-size:14px;
  }

  .btn{
    min-height:52px;
    padding:12px;
    font-size:14px;
  }
}

.module-gallery{display:none;margin:18px 0 20px;text-align:left}.module-gallery h2{font-size:15px;margin:0 0 10px;text-align:center}.gallery-stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}.gallery-stage img{width:100%;height:100%;object-fit:cover;display:block}.gallery-dots{display:flex;justify-content:center;gap:6px;margin-top:9px}.gallery-dot{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.28)}.gallery-dot.active{background:#fff}.gallery-nav{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.gallery-nav button{pointer-events:auto;width:34px;height:34px;margin:8px;border:0;border-radius:50%;background:rgba(0,0,0,.48);color:#fff;font-size:20px;cursor:pointer}
.module-audio{display:none;margin:18px 0;padding:14px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}.module-audio h2{font-size:15px;margin-bottom:10px}.module-audio audio{width:100%;display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
</head>

<body>

<a class="com-brandbar" href="/" aria-label="ClickOnMe, inicio">
  <img class="com-brand-logo" src="../logo-clickonme.png" alt="ClickOnMe — Un clic y listo">
</a>

<div class="card">

  <div class="avatar" id="avatar">
    CM
  </div>

  <h1 id="profileName">Mi ClickOnMe</h1>

  <div class="role" id="profileRole">
    Tarjeta digital
  </div>

  <div class="com-brand-tagline">Tu mundo, en un solo enlace</div>
  <div class="com-brand-rule"></div>

<div class="description" id="profileDescription">
    Todo lo que necesitas para contactarme, en un solo lugar.
  </div>


  <section class="module-gallery" id="galleryModule" aria-label="Galería">
    <h2 id="galleryModuleTitle">Galería</h2>
    <div class="gallery-stage"><img id="galleryStageImage" alt=""><div class="gallery-nav"><button type="button" id="galleryPrev" aria-label="Anterior">‹</button><button type="button" id="galleryNext" aria-label="Siguiente">›</button></div></div>
    <div class="gallery-dots" id="galleryDots"></div>
  </section>
  <section class="module-audio" id="audioModule" aria-label="Audio destacado"><h2 id="audioModuleTitle">Audio destacado</h2><audio id="profileAudio" controls preload="metadata"></audio></section>
  <div class="links">
    <a class="btn" id="whatsappBtn" href="#" style="display:none;">
      💬 &nbsp; WhatsApp
    </a>

    <a class="btn" id="phoneBtn" href="#" style="display:none;">
      📞 &nbsp; Llamar
    </a> <a class="btn" id="facebookBtn" href="#" style="display:none;">
  Facebook
</a>

<a class="btn" id="instagramBtn" href="#" style="display:none;">
  Instagram
</a>

<a class="btn" id="youtubeBtn" href="#" style="display:none;">
  ▶ YouTube
</a>

<a class="btn" id="websiteBtn" href="#" style="display:none;">
  🌐 Sitio web
</a> <a class="btn" id="customButtonBtn" href="#" style="display:none;"></a>
  </div>

  <div class="footer"><span>Mi tarjeta digital con</span><img src="../logo-clickonme.png" alt="ClickOnMe — Un clic y listo"></div>

</div>

<script>
const client = window.supabase.createClient(window.CLICKONME_SUPABASE_URL, window.CLICKONME_SUPABASE_KEY);
const params = new URLSearchParams(window.location.search);
const slug = (params.get("u")||"").toLowerCase().replace(/[^a-z0-9-]/g,"");

function safeWebUrl(value){
  if(!value) return "";
  try{ const url=new URL(value); return ["https:","http:"].includes(url.protocol)?url.href:""; }catch{return "";}
}
function safeImage(value){
  if(!value) return "";
  if(/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(value)) return value;
  return safeWebUrl(value);
}
function hexToRgba(hex,opacity){
  const match=/^#([0-9a-f]{6})$/i.exec(hex||""); if(!match) return "rgba(9,10,20,.9)";
  const n=parseInt(match[1],16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${Math.max(0,Math.min(1,Number(opacity)/100))})`;
}
const fallbackIcons={whatsapp:"💬",phone:"📞",facebook:"f",instagram:"◎",youtube:"▶",website:"🌐",custom:"🔗"};
function iconHtml(d,key){const value=d.customIcons&&d.customIcons[key];return value?`<span class="btn-icon"><img src="${safeImage(value)}" alt=""></span>`:`<span class="btn-icon">${fallbackIcons[key]||"🔗"}</span>`;}
function setButtonContent(el,d,key,text){el.replaceChildren();const icon=document.createElement("span");icon.className="button-icon";const raw=String(d?.iconOverrides?.[key]||"").trim();if(raw && /^[A-Za-z0-9 _+\-★☆♥♡✓✔☎✉@#]{1,12}$/.test(raw)) icon.textContent=raw;const label=document.createElement("span");label.textContent=String(text||"");if(icon.textContent)el.appendChild(icon);el.appendChild(label);}
function setBtn(id,url,text,d,key){
  const el=document.getElementById(id); const safe=safeWebUrl(url);
  if(!safe) return; el.href=safe; if(text)setButtonContent(el,d,key,text); el.target="_blank"; el.rel="noopener noreferrer"; el.style.display="flex";
}
function styleButton(button,d){
  button.style.borderRadius=(d.buttonRadius||15)+"px"; button.style.color=d.textColor||"#fff"; button.style.boxShadow="none"; button.style.backdropFilter="none";
  if(d.buttonStyle==="outline"){button.style.background="transparent";button.style.border=`2px solid ${d.buttonColor||"#075cff"}`;button.style.color=d.buttonColor||"#075cff";}
  else if(d.buttonStyle==="glass"){button.style.background="rgba(255,255,255,.10)";button.style.border="1px solid rgba(255,255,255,.22)";button.style.backdropFilter="blur(10px)";}
  else{button.style.background=d.buttonColor||"#222533";button.style.border="1px solid rgba(255,255,255,.12)";if(d.buttonStyle==="shadow")button.style.boxShadow="0 8px 20px rgba(0,0,0,.35)";}
}

function renderAudioModule(d){
 const mod=d?.modules?.audio;if(!mod?.enabled)return;const url=safeWebUrl(mod.url);if(!url)return;const root=document.getElementById("audioModule"),audio=document.getElementById("profileAudio");document.getElementById("audioModuleTitle").textContent=String(mod.title||"Audio destacado").slice(0,80);audio.src=url;root.style.display="block";
}
function renderGalleryModule(d){
  const mod=d?.modules?.gallery; const items=Array.isArray(mod?.items)?mod.items.slice(0,6):[];
  const safeItems=items.map(x=>({url:safeImage(x?.url),alt:String(x?.alt||"").slice(0,120)})).filter(x=>x.url);
  if(!mod?.enabled||!safeItems.length)return;
  const root=document.getElementById("galleryModule"),image=document.getElementById("galleryStageImage"),dots=document.getElementById("galleryDots");
  document.getElementById("galleryModuleTitle").textContent=String(mod.title||"Galería").slice(0,60); let index=0,timer=null;
  function show(i){index=(i+safeItems.length)%safeItems.length;image.src=safeItems[index].url;image.alt=safeItems[index].alt||"Imagen "+(index+1);Array.from(dots.children).forEach((dot,n)=>dot.classList.toggle("active",n===index));}
  safeItems.forEach((_,i)=>{const dot=document.createElement("button");dot.type="button";dot.className="gallery-dot";dot.setAttribute("aria-label","Ver imagen "+(i+1));dot.addEventListener("click",()=>{show(i);restart();});dots.appendChild(dot);});
  const restart=()=>{if(timer)clearInterval(timer);if(safeItems.length>1)timer=setInterval(()=>show(index+1),4500);};
  document.getElementById("galleryPrev").addEventListener("click",()=>{show(index-1);restart();});document.getElementById("galleryNext").addEventListener("click",()=>{show(index+1);restart();});
  if(safeItems.length===1)document.querySelector(".gallery-nav").style.display="none";root.style.display="block";show(0);restart();
}

async function loadProfile(){
 if(!slug){document.getElementById("profileName").textContent="Perfil no encontrado";document.getElementById("profileRole").textContent="La dirección está incompleta.";return;}
 const {data:row,error}=await client.from('profiles').select('name,role,description,photo_url,whatsapp,phone,facebook,instagram,youtube,website,data,status,trial_ends_at,current_period_end').eq('slug',slug).maybeSingle();
 if(error || !row){document.getElementById("profileName").textContent="Perfil no encontrado";document.getElementById("profileRole").textContent="Esta tarjeta no existe o no está disponible.";return;}
 const accessEnd=row.status==='active'?row.current_period_end:row.trial_ends_at;
 const expired=accessEnd&&new Date(accessEnd).getTime()<=Date.now();
 if(['suspended','expired'].includes(row.status)||expired){
   document.getElementById("profileName").textContent="Tarjeta temporalmente no disponible";
   document.getElementById("profileRole").textContent="El propietario debe renovar su Plan Pro para volver a publicarla.";
   document.getElementById("profileDescription").textContent="";
   return;
 }
 const d={...row,...(row.data||{})};
 document.getElementById("profileName").textContent=d.name||"Mi ClickOnMe";
 document.title=(d.name||"Mi ClickOnMe")+" | ClickOnMe";
 document.getElementById("profileRole").textContent=d.role||"";
 document.getElementById("profileDescription").textContent=d.description||"";
 const photo=safeImage(d.photo); const avatar=document.getElementById('avatar');
 if(photo){avatar.innerHTML='';const img=document.createElement('img');img.src=photo;img.alt=d.name||'Foto de perfil';img.style.objectFit=d.photoFit||'cover';avatar.appendChild(img);}
 ['rounded','square','portrait','wide'].forEach(s=>avatar.classList.remove('shape-'+s)); if(d.photoShape&&d.photoShape!=='circle')avatar.classList.add('shape-'+d.photoShape);
 const background=safeImage(d.backgroundImage);
 if(d.backgroundType==="image" && background) document.body.style.setProperty('--profile-bg',`url("${background}")`);
 else if(d.backgroundType==="color") document.body.style.setProperty('--profile-bg',d.color1||"#090b18");
 else document.body.style.setProperty('--profile-bg',`linear-gradient(160deg,${d.color1||'#075cff'},${d.color2||'#090b18'})`);
 document.body.style.setProperty('--profile-position',d.backgroundPosition||'center'); document.body.style.setProperty('--profile-blur',(d.backgroundBlur||0)+'px'); document.body.style.setProperty('--profile-overlay',hexToRgba(d.backgroundOverlayColor||'#000000',d.backgroundOverlay||0));
 const card=document.querySelector('.card'); card.style.background=hexToRgba(d.cardColor||"#0b0d18",d.cardOpacity||90); card.style.fontFamily=d.fontFamily||"Arial, Helvetica, sans-serif"; card.style.color=d.textColor||"#fff";
 if(d.secondaryTextColor){document.getElementById('profileRole').style.color=d.secondaryTextColor;document.getElementById('profileDescription').style.color=d.secondaryTextColor;}
 const wa=(d.whatsapp||"").replace(/\D/g,""); if(wa){const el=document.getElementById('whatsappBtn');el.href='https://wa.me/'+wa;setButtonContent(el,d,'whatsapp','WhatsApp');el.style.display='flex';}
 const phone=(d.phone||"").replace(/[^\d+]/g,""); if(phone){const el=document.getElementById('phoneBtn');el.href='tel:'+phone;setButtonContent(el,d,'phone','Llamar');el.style.display='flex';}
 setBtn('facebookBtn',d.facebook,'Facebook',d,'facebook'); setBtn('instagramBtn',d.instagram,'Instagram',d,'instagram'); setBtn('youtubeBtn',d.youtube,'YouTube',d,'youtube'); setBtn('websiteBtn',d.website,'Sitio web',d,'website');
 setBtn('customButtonBtn',d.customButtonUrl,d.customButtonText||'Enlace',d,'custom');
 renderGalleryModule(d); renderAudioModule(d);
 const links=document.querySelector('.links');
 (Array.isArray(d.extraCustomButtons)?d.extraCustomButtons:[]).slice(0,2).forEach(x=>{const url=safeWebUrl(x.url);if(!x.text||!url)return;const a=document.createElement('a');a.className='btn';a.href=url;setButtonContent(a,d,'custom',x.text);a.target='_blank';a.rel='noopener noreferrer';links.appendChild(a);});
 document.querySelectorAll('.btn').forEach(button=>styleButton(button,d));
}
loadProfile();
</script>

</body>
</html>
