<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi ClickOnMe</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial, Helvetica, sans-serif;
  background:radial-gradient(circle at top right,#26143b 0,#10152b 45%,#070810 100%);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:440px;
  padding:34px 28px;
  border-radius:32px;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 25px 60px rgba(0,0,0,.35);
  text-align:center;
}

.avatar{
  width:110px;
  height:110px;
  margin:0 auto 20px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  background:rgba(255,255,255,.08);
  border:3px solid rgba(255,255,255,.35);
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

.role{
  color:#d5d6e5;
  font-size:16px;
  margin-bottom:16px;
}

.description{
  color:#b9bbca;
  font-size:14px;
  line-height:1.5;
  margin-bottom:22px;
}

.brand{
  font-size:27px;
  font-weight:800;
  margin:12px 0 25px;
}

.brand span{
  color:#1677ff;
}

.links{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:58px;
  padding:15px;
  border-radius:17px;
  text-decoration:none;
  color:white;
  font-weight:700;
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);
}

.btn:hover{
  background:rgba(255,255,255,.15);
}

.footer{
  margin-top:25px;
  color:#85889a;
  font-size:11px;
  line-height:1.5;
}

@media(max-width:600px){
  body{
    padding:10px;
    align-items:flex-start;
  }

  .card{
    max-width:390px;
    padding:22px 16px;
    border-radius:24px;
  }

  .avatar{
    width:82px;
    height:82px;
    margin-bottom:12px;
  }

  h1{
    font-size:22px;
  }

  .role{
    font-size:14px;
  }

  .btn{
    min-height:52px;
    padding:12px;
    font-size:14px;
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../supabase-config.js"></script>
</head>

<body>

<div class="card">

  <div class="avatar" id="avatar">
    CM
  </div>

  <h1 id="profileName">Mi ClickOnMe</h1>

  <div class="role" id="profileRole">
    Tarjeta digital
  </div>

  <div class="brand">
    Click<span>OnMe</span>
  </div>

<div class="description" id="profileDescription">
    Todo lo que necesitas para contactarme, en un solo lugar.
  </div>

  <div class="links">
    <a class="btn" id="whatsappBtn" href="#" style="display:none;">
      💬 &nbsp; WhatsApp
    </a>

    <a class="btn" id="phoneBtn" href="#" style="display:none;">
      📞 &nbsp; Llamar
    </a> <a class="btn" id="facebookBtn" href="#" style="display:none;">
  Facebook
</a>

<a class="btn" id="instagramBtn" href="#" style="display:none;">
  Instagram
</a>

<a class="btn" id="youtubeBtn" href="#" style="display:none;">
  ▶ YouTube
</a>

<a class="btn" id="websiteBtn" href="#" style="display:none;">
  🌐 Sitio web
</a> <a class="btn" id="customButtonBtn" href="#" style="display:none;"></a>
  </div>

  <div class="footer">
    Tu tarjeta digital inteligente.<br>
    <strong>CLICKONME.PRO</strong>
  </div>

</div>

<script>
const client = window.supabase.createClient(window.CLICKONME_SUPABASE_URL, window.CLICKONME_SUPABASE_KEY);
const params = new URLSearchParams(window.location.search);
const slug = (params.get("u")||"").toLowerCase().replace(/[^a-z0-9-]/g,"");

function safeWebUrl(value){
  if(!value) return "";
  try{ const url=new URL(value); return ["https:","http:"].includes(url.protocol)?url.href:""; }catch{return "";}
}
function safeImage(value){
  if(!value) return "";
  if(/^data:image\/(png|jpe?g|webp|gif);base64,/i.test(value)) return value;
  return safeWebUrl(value);
}
function hexToRgba(hex,opacity){
  const match=/^#([0-9a-f]{6})$/i.exec(hex||""); if(!match) return "rgba(9,10,20,.9)";
  const n=parseInt(match[1],16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${Math.max(0,Math.min(1,Number(opacity)/100))})`;
}
function setBtn(id,url,text){
  const el=document.getElementById(id); const safe=safeWebUrl(url);
  if(!safe) return; el.href=safe; if(text) el.textContent=text; el.target="_blank"; el.rel="noopener noreferrer"; el.style.display="flex";
}
function styleButton(button,d){
  button.style.borderRadius=(d.buttonRadius||15)+"px"; button.style.color=d.textColor||"#fff"; button.style.boxShadow="none"; button.style.backdropFilter="none";
  if(d.buttonStyle==="outline"){button.style.background="transparent";button.style.border=`2px solid ${d.buttonColor||"#075cff"}`;button.style.color=d.buttonColor||"#075cff";}
  else if(d.buttonStyle==="glass"){button.style.background="rgba(255,255,255,.10)";button.style.border="1px solid rgba(255,255,255,.22)";button.style.backdropFilter="blur(10px)";}
  else{button.style.background=d.buttonColor||"#222533";button.style.border="1px solid rgba(255,255,255,.12)";if(d.buttonStyle==="shadow")button.style.boxShadow="0 8px 20px rgba(0,0,0,.35)";}
}
async function loadProfile(){
 if(!slug){document.getElementById("profileName").textContent="Perfil no encontrado";document.getElementById("profileRole").textContent="La dirección está incompleta.";return;}
 const {data:row,error}=await client.from('profiles').select('data').eq('slug',slug).maybeSingle();
 if(error || !row){document.getElementById("profileName").textContent="Perfil no encontrado";document.getElementById("profileRole").textContent="Esta tarjeta no existe o no está disponible.";return;}
 const d=row.data||{};
 document.getElementById("profileName").textContent=d.name||"Mi ClickOnMe";
 document.title=(d.name||"Mi ClickOnMe")+" | ClickOnMe";
 document.getElementById("profileRole").textContent=d.role||"";
 document.getElementById("profileDescription").textContent=d.description||"";
 const photo=safeImage(d.photo); if(photo){const a=document.getElementById('avatar');a.innerHTML='';const img=document.createElement('img');img.src=photo;img.alt=d.name||'Foto de perfil';a.appendChild(img);}
 const background=safeImage(d.backgroundImage);
 if(d.backgroundType==="image" && background) document.body.style.background=`linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),url("${background}") center/cover fixed`;
 else if(d.backgroundType==="color") document.body.style.background=d.color1||"#090b18";
 else document.body.style.background=`linear-gradient(160deg,${d.color1||'#075cff'},${d.color2||'#090b18'})`;
 const card=document.querySelector('.card'); card.style.background=hexToRgba(d.cardColor||"#0b0d18",d.cardOpacity||90); card.style.fontFamily=d.fontFamily||"Arial, Helvetica, sans-serif"; card.style.color=d.textColor||"#fff";
 if(d.secondaryTextColor){document.getElementById('profileRole').style.color=d.secondaryTextColor;document.getElementById('profileDescription').style.color=d.secondaryTextColor;}
 const wa=(d.whatsapp||"").replace(/\D/g,""); if(wa){const el=document.getElementById('whatsappBtn');el.href='https://wa.me/'+wa;el.textContent='💬  WhatsApp';el.style.display='flex';}
 const phone=(d.phone||"").replace(/[^\d+]/g,""); if(phone){const el=document.getElementById('phoneBtn');el.href='tel:'+phone;el.textContent='📞  Llamar';el.style.display='flex';}
 setBtn('facebookBtn',d.facebook,'Facebook'); setBtn('instagramBtn',d.instagram,'Instagram'); setBtn('youtubeBtn',d.youtube,'▶ YouTube'); setBtn('websiteBtn',d.website,'🌐 Sitio web');
 setBtn('customButtonBtn',d.customButtonUrl,d.customButtonText||'Enlace');
 const links=document.querySelector('.links');
 (Array.isArray(d.extraCustomButtons)?d.extraCustomButtons:[]).slice(0,2).forEach(x=>{const url=safeWebUrl(x.url);if(!x.text||!url)return;const a=document.createElement('a');a.className='btn';a.href=url;a.textContent='🔗 '+x.text;a.target='_blank';a.rel='noopener noreferrer';links.appendChild(a);});
 document.querySelectorAll('.btn').forEach(button=>styleButton(button,d));
}
loadProfile();
</script>

</body>
</html>
