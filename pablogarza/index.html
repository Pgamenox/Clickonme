<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Poppins',sans-serif;
background:radial-gradient(circle at top right,rgba(189,25,255,.22),transparent 38%),radial-gradient(circle at bottom left,rgba(0,229,255,.18),transparent 35%),var(--com-bg);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
gap:14px;
padding:30px;
color:white;
overflow-x:hidden;
}

body::before{
content:'';
position:fixed;
width:500px;
height:500px;
background:var(--com-purple);
filter:blur(170px);
opacity:.15;
top:-150px;
right:-100px;
z-index:-2;
}

body::after{
content:'';
position:fixed;
width:450px;
height:450px;
background:var(--com-cyan);
filter:blur(160px);
opacity:.18;
bottom:-120px;
left:-100px;
z-index:-2;
}

.card{
width:100%;
max-width:430px;
background:rgba(255,255,255,.07);
backdrop-filter:blur(25px);
border:1px solid rgba(255,255,255,.12);
border-radius:34px;
padding:34px 28px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.45);
animation:fade .7s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:none}
}

.avatar{
width:118px;
height:118px;
margin:auto;
border-radius:50%;
background:var(--com-gradient);
display:flex;
justify-content:center;
align-items:center;
font-size:44px;
font-weight:700;
box-shadow:0 0 40px rgba(255,43,214,.4);
margin-bottom:18px;
overflow:hidden;}
.avatar img{
width:100%;
height:100%;
object-fit:cover;
object-position:center;
border-radius:50%;
display:block;
}
h1{
font-size:28px;
font-weight:700;
}

.role{
margin-top:6px;
color:#cfcfe7;
font-size:15px;
line-height:1.6;
}

.brand{
display:inline-block;
margin-top:16px;
padding:0;
background:transparent;
}


.brand img{
width:180px;
max-width:100%;
height:auto;
display:block;
}
.links{
margin-top:28px;
display:flex;
flex-direction:column;
gap:16px;
}

.btn{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
text-decoration:none;
color:white;
padding:17px;
border-radius:18px;
font-weight:600;
font-size:16px;
background:rgba(255,255,255,.09);
border:1px solid rgba(255,255,255,.12);
transition:.25s;
}

.btn:hover{
transform:translateY(-3px) scale(1.02);
background:rgba(255,255,255,.16);
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.icon{
font-size:22px;
}

.footer{
margin-top:28px;
font-size:12px;
color:#9ca3af;
}

.logo{
margin-top:10px;
font-size:14px;
font-weight:600;
color:#ff77e9;
letter-spacing:1px;
}

.logo a{
color:inherit;
text-decoration:none;
}
@media (max-width: 600px){

  body{
    padding:18px 12px;
    align-items:flex-start;
  }

  .card{
    width:100%;
    max-width:430px;
    padding:26px 18px;
    border-radius:26px;
  }

  .avatar{
    width:100px;
    height:100px;
    font-size:38px;
    margin-bottom:16px;
  }

  h1{
    font-size:26px;
    line-height:1.2;
  }

  .role{
    font-size:15px;
    line-height:1.5;
  }

  .links{
    margin-top:24px;
    gap:12px;
  }

  .btn{
    padding:16px 12px;
    font-size:16px;
    min-height:62px;
  }

} @media (max-width: 600px){

  body{
    padding:12px;
    align-items:flex-start;
  }

  .card{
    width:100%;
    max-width:390px;
    padding:20px 16px;
    border-radius:24px;
  }

  .avatar{
    width:82px;
    height:82px;
    margin-bottom:12px;
  }

  h1{
    font-size:22px;
    line-height:1.15;
  }

  .role{
    font-size:13px;
    line-height:1.4;
  }

  .brand{
    margin-top:12px;
  }

  .brand img{
    width:145px;
  }

  .links{
    margin-top:18px;
    gap:10px;
  }

  .btn{
    padding:13px 10px;
    font-size:14px;
    min-height:54px;
    border-radius:16px;
  }

  .icon{
    font-size:18px;
  }

  .footer{
    margin-top:18px;
    font-size:11px;
    line-height:1.35;
  }

}
